name: 🔔🚀

run-name: 🔔🚀

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: notification-${{ github.repository_id }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate static site
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate static site
        shell: bash
        env:
          SITE_ROOT: '.'
        run: |
          set -euo pipefail

          [[ -s "${SITE_ROOT}/index.html" ]] || {
            echo "Missing or empty ${SITE_ROOT}/index.html" >&2
            exit 1
          }

          python3 \
            -m http.server 8080 \
            --bind 127.0.0.1 \
            --directory "${SITE_ROOT}" \
            >"${RUNNER_TEMP}/site-validation.log" \
            2>&1 &

          server_pid=$!

          cleanup() {
            kill "${server_pid}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in {1..20}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 5 \
              'http://127.0.0.1:8080/' \
              >/dev/null
            then
              exit 0
            fi

            sleep 1
          done

          echo 'Static-site HTTP validation failed' >&2
          cat "${RUNNER_TEMP}/site-validation.log" >&2
          exit 1

  notify:
    name: Send deployment notification
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Send authenticated notification
        shell: bash
        env:
          DISPATCH_TOKEN: ${{ secrets.WEB2ONION_DISPATCH_TOKEN }}
          TARGET_REPOSITORY: ${{ secrets.WEB2ONION_TARGET_REPOSITORY }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          [[ -n "${DISPATCH_TOKEN}" ]] || {
            echo 'Dispatch credential is not configured' >&2
            exit 78
          }

          [[ "${TARGET_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo 'Target repository setting is invalid' >&2
            exit 78
          }

          [[ "${SOURCE_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo 'Source repository metadata is invalid' >&2
            exit 64
          }

          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Source commit metadata is invalid' >&2
            exit 64
          }

          source_prefix="https://github.com/${SOURCE_REPOSITORY}/actions/runs/"

          [[ "${SOURCE_RUN_URL}" == "${source_prefix}"* ]] || {
            echo 'Source workflow URL is invalid' >&2
            exit 64
          }

          source_run_id="${SOURCE_RUN_URL#"${source_prefix}"}"

          [[ "${source_run_id}" =~ ^[0-9]+$ ]] || {
            echo 'Source workflow run ID is invalid' >&2
            exit 64
          }

          payload="$(
            jq -cn \
              --arg repository "${SOURCE_REPOSITORY}" \
              --arg sha "${SOURCE_SHA}" \
              --arg run_url "${SOURCE_RUN_URL}" \
              '{
                event_type: "source-updated",
                client_payload: {
                  repository: $repository,
                  sha: $sha,
                  run_url: $run_url
                }
              }'
          )"

          response="${RUNNER_TEMP}/dispatch-response.txt"

          http_code="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 15 \
              --max-time 60 \
              --output "${response}" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --data "${payload}" \
              "https://api.github.com/repos/${TARGET_REPOSITORY}/dispatches"
          )"

          rm -f -- "${response}"

          if [[ "${http_code}" != '204' ]]; then
            echo "Notification failed with HTTP ${http_code}" >&2
            exit 1
          fi

          echo 'Authenticated deployment notification accepted.'
